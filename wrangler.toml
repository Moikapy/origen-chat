name = "origen-chat"
compatibility_date = "2025-04-10"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "origen-chat-db"
database_id = "1262c9af-0a6d-4baa-93b8-9cf87aec1c45"

# Cloudflare Email Sending — native Workers binding (free: 3K emails/month)
[[send_email]]
name = "SEB"

[vars]
APP_URL = "https://origen-chat.moikapy.workers.dev"
FROM_EMAIL = "Origen Chat <no_reply@moikapy.dev>"
TREASURY_WALLET = "0x1fC5F441de0800d7e92f8d111C7e2f2AFe038c8C"
BASE_RPC_URL = "https://mainnet.base.org"
REVENUE_MANAGER_ADDRESS = "0x82a8eba09d1d27cf74884cc611e5a1223e1e80c1"